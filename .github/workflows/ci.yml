name: AllowAgent MCP CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - name: Check credential handling in Chrome
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: |
          python3 -m venv "$RUNNER_TEMP/allowagent-browser"
          "$RUNNER_TEMP/allowagent-browser/bin/pip" install -r tests/e2e/requirements.txt
          "$RUNNER_TEMP/allowagent-browser/bin/python" tests/e2e/real_browser_test.py
